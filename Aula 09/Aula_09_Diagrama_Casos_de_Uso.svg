<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
<defs>
  <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
  <marker id="associationDot" markerWidth="1" markerHeight="1" refX="0" refY="0"><circle cx="0" cy="0" r="1" fill="#64748b"/></marker>
  <style>
    .title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#172033}
    .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#64748b}
    .boundary{fill:#ffffff;stroke:#334155;stroke-width:2.4}
    .boundary-title{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700;fill:#1f2937}
    .usecase{fill:#f5f8ff;stroke:#3b82f6;stroke-width:2.2}
    .usecase-label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:600;fill:#1e293b;text-anchor:middle}
    .actor-line{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .dependency{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}
    .actor-shape{fill:none;stroke:#334155;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .actor-label{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:600;fill:#1f2937;text-anchor:middle}
    .actor-sub{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#64748b;text-anchor:middle}
    .rel-label{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#334155;text-anchor:middle}
    .foot{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#64748b}
  </style>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="60" y="54" class="title">Diagrama de Casos de Uso — Sistema de Gestão da Padaria</text>
<text x="60" y="84" class="subtitle">Aula 9 • Personas e casos de uso | Domínio escolhido: venda e controle de estoque de uma padaria</text>
<!-- Boundary -->
<rect x="310" y="145" width="1020" height="790" rx="2" class="boundary"/>
<text x="335" y="180" class="boundary-title">Sistema de Gestão da Padaria</text>
<!-- Associations drawn behind the use cases -->
<g class="actor-line">
  <path d="M 174 320 L 430 260"/>
  <path d="M 174 320 L 255 320 L 355 460 L 430 460"/>
  <!-- payment gateway to electronic payment -->
  <path d="M 1544 255 L 1160 260"/>
  <!-- Separate UML associations from the manager to each management use case -->
  <path d="M 1160 460 L 1535 646"/>
  <path d="M 1160 660 L 1535 662"/>
  <path d="M 1160 830 L 1535 680"/>
</g>
<!-- include: Registrar venda includes Consultar estoque -->
<path d="M 570 300 L 570 420" class="dependency" marker-end="url(#openArrow)"/>
<rect x="577" y="341" width="120" height="25" rx="3" fill="#ffffff"/>
<text x="637" y="358" class="rel-label">&lt;&lt;include&gt;&gt;</text>
<!-- extend: electronic payment optionally extends sale -->
<path d="M 860 260 L 710 260" class="dependency" marker-end="url(#openArrow)"/>
<rect x="711" y="221" width="148" height="35" rx="3" fill="#ffffff"/>
<text x="785" y="235" class="rel-label">&lt;&lt;extend&gt;&gt;</text>
<text x="785" y="250" class="rel-label" style="font-size:12px;font-weight:400">[pagamento eletrônico]</text>
<!-- Use cases -->
<g>
  <ellipse cx="570" cy="260" rx="140" ry="40" class="usecase"/>
  <text x="570" y="266" class="usecase-label">Registrar venda</text>

  <ellipse cx="570" cy="460" rx="140" ry="40" class="usecase"/>
  <text x="570" y="466" class="usecase-label">Consultar estoque</text>

  <ellipse cx="1010" cy="260" rx="150" ry="40" class="usecase"/>
  <text x="1010" y="253" class="usecase-label"><tspan x="1010" dy="0">Processar pagamento</tspan><tspan x="1010" dy="22">eletrônico</tspan></text>

  <ellipse cx="1010" cy="460" rx="150" ry="40" class="usecase"/>
  <text x="1010" y="453" class="usecase-label"><tspan x="1010" dy="0">Registrar entrada de</tspan><tspan x="1010" dy="22">mercadoria</tspan></text>

  <ellipse cx="1010" cy="660" rx="150" ry="40" class="usecase"/>
  <text x="1010" y="666" class="usecase-label">Cancelar venda</text>

  <ellipse cx="1010" cy="830" rx="150" ry="40" class="usecase"/>
  <text x="1010" y="823" class="usecase-label"><tspan x="1010" dy="0">Consultar relatório</tspan><tspan x="1010" dy="22">de vendas</tspan></text>
</g>
<!-- Actors -->
<g class="actor-shape">
  <!-- Atendente/Caixa -->
  <circle cx="150" cy="285" r="13"/>
  <path d="M 150 298 L 150 340 M 126 316 L 174 316 M 150 340 L 128 372 M 150 340 L 172 372"/>
  <!-- Payment system actor -->
  <circle cx="1570" cy="220" r="13"/>
  <path d="M 1570 233 L 1570 273 M 1547 248 L 1593 248 M 1570 273 L 1550 303 M 1570 273 L 1590 303"/>
  <!-- Gerente -->
  <circle cx="1535" cy="630" r="13"/>
  <path d="M 1535 643 L 1535 685 M 1512 662 L 1558 662 M 1535 685 L 1514 716 M 1535 685 L 1556 716"/>
</g>
<text x="150" y="401" class="actor-label">Atendente / Caixa</text>
<text x="150" y="421" class="actor-sub">Ator principal</text>
<text x="1570" y="327" class="actor-label">Sistema de pagamento</text>
<text x="1570" y="347" class="actor-sub">Ator secundário</text>
<text x="1535" y="745" class="actor-label">Gerente</text>
<text x="1535" y="765" class="actor-sub">Ator principal</text>
<!-- Legend -->
<g transform="translate(60,970)">
  <path d="M 0 0 L 65 0" class="actor-line"/><text x="78" y="5" class="foot">Associação: ator participa do caso de uso</text>
  <path d="M 420 0 L 485 0" class="dependency" marker-end="url(#openArrow)"/><text x="500" y="5" class="foot">Relação de dependência UML: include / extend</text>
</g>
<text x="60" y="1010" class="foot">Observação: associações não indicam sequência; o fluxo passo a passo fica na especificação do caso de uso.</text>
</svg>