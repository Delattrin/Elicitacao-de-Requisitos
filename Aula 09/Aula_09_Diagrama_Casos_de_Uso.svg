<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120">
<defs>
 <marker id="depArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#475569" stroke-width="1.3"/></marker>
 <style>
 .title{font:700 30px Arial,sans-serif;fill:#14213d}.subtitle{font:17px Arial,sans-serif;fill:#64748b}
 .boundary{fill:#fff;stroke:#334155;stroke-width:2.5}.btitle{font:700 22px Arial,sans-serif;fill:#1e293b}
 .uc{fill:#f4f7ff;stroke:#3769b1;stroke-width:2.2}.uclabel{font:600 18px Arial,sans-serif;fill:#1e293b;text-anchor:middle}
 .actor{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.actorlabel{font:600 17px Arial,sans-serif;fill:#1e293b;text-anchor:middle}.actorrole{font:14px Arial,sans-serif;fill:#64748b;text-anchor:middle}
 .association{fill:none;stroke:#64748b;stroke-width:2.2}.dependency{fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:9 7}
 .stereo{font:600 15px Arial,sans-serif;fill:#334155;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#64748b}
 </style>
</defs>
<rect width="1700" height="1120" fill="#f8fafc"/>
<text x="60" y="55" class="title">Diagrama de Casos de Uso — Sistema de Solicitação de Férias</text>
<text x="60" y="85" class="subtitle">Aula 9 • Personas e casos de uso | Referência: processo de férias apresentado no material da disciplina</text>
<rect x="320" y="145" width="1060" height="870" class="boundary"/>
<text x="345" y="183" class="btitle">Sistema de Solicitação de Férias</text>
<!-- Associations: actor to use case -->
<g class="association">
 <!-- Collaborator: separate orthogonal routes to two use cases -->
 <path d="M175 360 L250 360 L250 270 L410 270"/>
 <path d="M175 360 L250 360 L250 800 L410 800"/>
 <!-- Manager, HR and external payroll system -->
 <path d="M1390 270 L1230 270"/>
 <path d="M1390 530 L1230 530"/>
 <path d="M1390 800 L1230 800"/>
</g>
<!-- UML dependencies -->
<!-- Request includes balance check -->
<path d="M560 315 L560 485" class="dependency" marker-end="url(#depArrow)"/>
<rect x="570" y="380" width="120" height="26" fill="#fff"/><text x="630" y="398" class="stereo">&lt;&lt;include&gt;&gt;</text>
<!-- Optional one-third conversion extends the vacation request -->
<path d="M850 385 L850 350 L710 315" class="dependency" marker-end="url(#depArrow)"/>
<rect x="770" y="335" width="115" height="26" fill="#fff"/><text x="827" y="353" class="stereo">&lt;&lt;extend&gt;&gt;</text>
<!-- Registering includes sending data to payroll -->
<path d="M1060 575 L1060 755" class="dependency" marker-end="url(#depArrow)"/>
<rect x="1070" y="650" width="120" height="26" fill="#fff"/><text x="1130" y="668" class="stereo">&lt;&lt;include&gt;&gt;</text>
<!-- Use cases -->
<g>
 <ellipse cx="560" cy="270" rx="150" ry="45" class="uc"/><text x="560" y="276" class="uclabel">Solicitar férias</text>
 <ellipse cx="560" cy="530" rx="150" ry="45" class="uc"/><text x="560" y="536" class="uclabel">Verificar saldo</text>
 <ellipse cx="560" cy="800" rx="150" ry="45" class="uc"/><text x="560" y="806" class="uclabel">Acompanhar pedido</text>
 <ellipse cx="1080" cy="270" rx="150" ry="45" class="uc"/><text x="1080" y="276" class="uclabel">Analisar pedido</text>
 <ellipse cx="1080" cy="530" rx="150" ry="45" class="uc"/><text x="1080" y="536" class="uclabel">Registrar férias</text>
 <ellipse cx="850" cy="430" rx="180" ry="45" class="uc"/><text x="850" y="436" class="uclabel">Vender um terço das férias</text>
 <ellipse cx="1080" cy="800" rx="150" ry="45" class="uc"/><text x="1080" y="794" class="uclabel"><tspan x="1080" dy="0">Enviar dados para</tspan><tspan x="1080" dy="22">folha de pagamento</tspan></text>
</g>
<!-- Actors -->
<g class="actor">
 <!-- Collaborator -->
 <circle cx="150" cy="315" r="14"/><path d="M150 329 L150 380 M122 348 L178 348 M150 380 L125 420 M150 380 L175 420"/>
 <!-- Manager -->
 <circle cx="1500" cy="225" r="14"/><path d="M1500 239 L1500 290 M1472 258 L1528 258 M1500 290 L1475 330 M1500 290 L1525 330"/>
 <!-- HR -->
 <circle cx="1500" cy="485" r="14"/><path d="M1500 499 L1500 550 M1472 518 L1528 518 M1500 550 L1475 590 M1500 550 L1525 590"/>
 <!-- Payroll system actor -->
 <circle cx="1500" cy="755" r="14"/><path d="M1500 769 L1500 820 M1472 788 L1528 788 M1500 820 L1475 860 M1500 820 L1525 860"/>
</g>
<text x="150" y="450" class="actorlabel">Colaborador</text><text x="150" y="470" class="actorrole">Ator principal</text>
<text x="1500" y="365" class="actorlabel">Gestor</text><text x="1500" y="385" class="actorrole">Ator principal</text>
<text x="1500" y="625" class="actorlabel">RH</text><text x="1500" y="645" class="actorrole">Ator principal</text>
<text x="1500" y="895" class="actorlabel">Sistema de folha</text><text x="1500" y="915" class="actorrole">Ator secundário • sistema externo</text>
<text x="345" y="1065" class="note">Linhas contínuas: associação entre ator e caso de uso. Linhas tracejadas: relações UML &lt;&lt;include&gt;&gt; e &lt;&lt;extend&gt;&gt;.</text>
</svg>